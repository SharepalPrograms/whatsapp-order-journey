<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Preview — SharePal Asset Partner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0b141a;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }

  .phone {
    width: 380px; max-width: 100%;
    background: #ECE5DD;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    border: 6px solid #1a1a1a;
  }

  /* WhatsApp header */
  .wa-header {
    background: #075E54;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    color: #fff;
  }
  .wa-back { font-size: 20px; opacity: 0.8; }
  .wa-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: #1944E8; color: #9FFE02;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex-shrink: 0;
  }
  .wa-name-block { flex: 1; }
  .wa-name { font-size: 15px; font-weight: 600; }
  .wa-status { font-size: 12px; color: rgba(255,255,255,0.75); }
  .wa-icons { display: flex; gap: 18px; font-size: 17px; opacity: 0.85; }

  /* Chat area */
  .wa-chat {
    padding: 16px 12px 20px;
    min-height: 480px;
    background: #ECE5DD;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(0,0,0,0.02) 2px, transparent 2px),
      radial-gradient(circle at 70% 40%, rgba(0,0,0,0.02) 2px, transparent 2px),
      radial-gradient(circle at 40% 70%, rgba(0,0,0,0.02) 2px, transparent 2px);
    background-size: 60px 60px;
  }

  .wa-date-chip {
    text-align: center; margin-bottom: 16px;
  }
  .wa-date-chip span {
    background: #E1F2FA; color: #5B6B73;
    font-size: 11.5px; font-weight: 600;
    padding: 5px 12px; border-radius: 8px;
  }

  .wa-bubble {
    background: #fff;
    border-radius: 8px;
    max-width: 88%;
    padding: 8px 8px 6px;
    box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    position: relative;
  }
  .wa-bubble::before {
    content: '';
    position: absolute; top: 0; left: -7px;
    width: 0; height: 0;
    border-top: 8px solid #fff;
    border-left: 8px solid transparent;
  }

  .wa-bubble-header {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px 8px;
  }
  .wa-bubble-logo { width: 20px; height: 20px; border-radius: 4px; background: #1944E8; display:flex; align-items:center; justify-content:center; }
  .wa-bubble-logo svg { width: 12px; height: auto; }
  .wa-bubble-brand { font-size: 12.5px; font-weight: 700; color: #075E54; }

  .wa-msg-text {
    font-size: 14px; color: #111b21; line-height: 1.5;
    padding: 0 6px 6px;
  }
  .wa-msg-text b { font-weight: 700; }

  .wa-cta-btn {
    display: block; text-align: center;
    margin: 6px 4px 4px;
    padding: 10px 8px;
    border-top: 1px solid #eee;
    font-size: 14.5px; font-weight: 600;
    color: #00A5F4;
    text-decoration: none;
    cursor: pointer;
  }
  .wa-cta-btn .wa-link-icon { margin-right: 6px; }

  .wa-meta {
    display: flex; justify-content: flex-end; align-items: center; gap: 3px;
    padding: 2px 8px 2px;
  }
  .wa-time { font-size: 11px; color: #667781; }
  .wa-ticks { color: #53BDEB; font-size: 13px; }

  /* Footer input bar (decorative) */
  .wa-footer {
    background: #ECE5DD;
    padding: 8px 10px 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .wa-input {
    flex: 1; background: #fff; border-radius: 22px;
    padding: 9px 14px; font-size: 13px; color: #8696A0;
  }
  .wa-mic {
    width: 38px; height: 38px; border-radius: 50%;
    background: #075E54; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .demo-note {
    max-width: 380px; margin: 16px auto 0; text-align: center;
    color: rgba(255,255,255,0.4); font-size: 12px;
  }
</style>
</head>
<body>

<div>
  <div class="phone">

    <div class="wa-header">
      <span class="wa-back">←</span>
      <div class="wa-avatar">S</div>

        <div class="wa-name">SharePal</div>

      <div class="wa-icons">
        <span>📹</span><span>📞</span><span>⋮</span>
      </div>
    </div>

    <div class="wa-chat">

      <div class="wa-bubble">

          <div class="wa-bubble-logo">
            <svg viewBox="0 0 168 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M4 23.3284H11.0467C11.2576 24.7166 12.927 25.7183 15.0181 25.7183C17.1796 25.7183 18.5327 24.8572 18.5327 23.592C18.5327 22.6606 18.0582 22.1159 15.6683 21.3778L13.0148 20.5695C8.77979 19.2867 6.53048 17.0022 6.53048 13.5404C6.53048 8.37397 10.994 5 17.1444 5C23.6815 5 27.6705 7.98737 27.7057 13.0132H20.905C20.8523 11.5019 19.4289 10.5003 17.3202 10.5003C15.3696 10.5003 14.1043 11.3789 14.1043 12.5739C14.1043 13.5931 14.8072 14.296 16.8457 14.8935L19.6222 15.7018C24.1735 17.0198 26.1417 18.9176 26.1417 22.5728C26.1417 27.9149 21.5728 31.2361 14.8775 31.2361C8.04173 31.2361 4.01757 28.3366 4 23.3284Z" fill="#9FFE02"/>
            </svg>
          </div>
          <span class="wa-bubble-brand">SharePal</span>
        </div>

        <div class="wa-msg-text">
          Your order <b>#BANGA1789738966206R</b> was for ₹1,870.<br><br>
          As a <b>SharePal Asset Partner</b>, you would pay only <b>₹295</b>.<br><br>
          Tap below to view your offer 👇
        </div>

        <a href="order-offer-page.html?order=BANGA1789738966206R&amp;amount=1870" class="wa-cta-btn" target="_blank">
          <span class="wa-link-icon">🔗</span>View Your Offer
        </a>

        <div class="wa-meta">
          <span class="wa-time">10:42 AM</span>
          <span class="wa-ticks">✓✓</span>
        </div>
      </div>
    </div>

    <div class="wa-footer">
      <div class="wa-input">Message</div>
      <div class="wa-mic">🎤</div>
    </div>

  </div>
  <div class="demo-note">Tap "View Your Offer" to preview the linked savings page →</div>
</div>

</body>
</html>
